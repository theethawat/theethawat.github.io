<html>
  <h3>Research Report on Laboratory Seminar (3/2026)</h3>
  <h1 id="seminarReport"></h1>
  <p>6 July 2026</p>

 <h3>Master Degree Graduation Ceremony</h3>

  <script>
    // Converting string to required date format
    let seminarReport = new Date("Jul 6, 2026 14:50:00").getTime();
    let gradCeremony = new Date("Sep 21, 2026 06:00:00").getTime();
    let livingAnniversary = new Date("Sep 27, 2026 14:00:00").getTime();


    // To call defined fuction every second
    let firstTDInt = setInterval(function () {
      // Getting current time in required format
      let now = new Date().getTime();

      // Calculating the difference
      let t = seminarReport - now;

      // Getting value of days, hours, minutes, seconds
      let days = Math.floor(t / (1000 * 60 * 60 * 24));
      let hours = Math.floor((t % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      let minutes = Math.floor((t % (1000 * 60 * 60)) / (1000 * 60));
      let seconds = Math.floor((t % (1000 * 60)) / 1000);

      // Output the remaining time
      document.getElementById("seminarReport").innerHTML =
        days + " Days " + hours + ":" + minutes + ":" + seconds + "";

      // Output for over time
      if (t < 0) {
        clearInterval(firstTDInt);
        document.getElementById("seminarReport").innerHTML = "EXPIRED";
      }
    }, 1000);
